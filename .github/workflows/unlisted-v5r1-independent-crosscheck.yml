name: UNLISTED V5R1 independent raw-source crosscheck
on:
  push:
    branches: [v5r1-independent-oracle-20261027]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-stdlib-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify independent script syntax
        run: python -m py_compile reviewer-evidence/v5r1/independent_raw_crosscheck.py
      - name: Re-download and verify all 15 EPSS and 16 CISA historical source blobs; compare independent replay with sealed derived tables
        run: python reviewer-evidence/v5r1/independent_raw_crosscheck.py
      - name: Retain only independent JSON certificate, not original third-party files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UNLISTED-V5R1-Independent-Raw-Source-Crosscheck
          path: reviewer-evidence/v5r1/INDEPENDENT_RAW_CROSSCHECK.json
          if-no-files-found: error
          retention-days: 30
